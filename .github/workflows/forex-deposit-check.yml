name: Forex deposit frontend checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "vite.config.ts"
      - ".github/workflows/forex-deposit-check.yml"
  push:
    branches: [feat/forex-mpesa-deposits]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint:types
      - run: npm run build
